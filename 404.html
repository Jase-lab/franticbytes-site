<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#03140a">
  <title>File not found — FranticBytes BBS</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.franticbytes.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="crt">
    <div class="bezel">
      <div class="screen-wrap">
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <header class="status-bar">
          <span id="status-left">FRANTICBBS  //  NODE 1<span class="status-baud">  //  2400 8-N-1</span>  //  ERROR 404</span>
          <span id="status-right"><span class="status-clock" id="status-clock"></span></span>
        </header>
        <main class="screen">
          <section class="panel">
            <h1 id="title">*** FILE NOT FOUND ***</h1>
            <p class="rule" aria-hidden="true">========================================</p>
            <p id="body">That path is not on this board.</p>
            <p class="dim" id="path"></p>
            <nav class="menu">
              <a class="menu-item" href="/#/menu"><kbd>M</kbd> Main Menu</a>
            </nav>
          </section>
        </main>
        <footer class="status-bar footer-bar">
          <span id="footer-left"></span>
          <span id="footer-right" class="sysop-corner">
            <span class="sysop-name">SYSOP: Lord Frazzle</span>
            <span class="presence" id="sysop-presence"><span class="dot" aria-hidden="true"></span><span class="presence-label"></span></span>
          </span>
        </footer>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var path = location.pathname || "/";
      document.getElementById("path").textContent = "Requested: " + path;
      if (/\/downloads\//i.test(path)) {
        document.title = "Coming soon — FranticBytes BBS";
        document.getElementById("title").textContent = "*** COMING SOON ***";
        document.getElementById("body").textContent =
          "That build has not been uploaded to the board yet. Check back after the next drop.";
      }

      function boardClock() {
        try {
          var parts = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Denver",
            day: "2-digit",
            month: "short",
            year: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23"
          }).formatToParts(new Date());
          var get = function (t) {
            for (var i = 0; i < parts.length; i++) if (parts[i].type === t) return parts[i].value;
            return "";
          };
          var date = get("day") + " " + get("month").replace(".", "").toUpperCase() + " " + get("year");
          var time = String(get("hour")).padStart(2, "0") + ":" + String(get("minute")).padStart(2, "0");
          return date + "  " + time;
        } catch (e) {
          return "";
        }
      }

      function sysopIsOnline() {
        try {
          var key = "fb_sysop_online";
          var existing = sessionStorage.getItem(key);
          if (existing === "1" || existing === "0") return existing === "1";
          var on = Math.random() < 0.5;
          sessionStorage.setItem(key, on ? "1" : "0");
          return on;
        } catch (e) {
          return Math.random() < 0.5;
        }
      }

      var on = sysopIsOnline();
      var presence = document.getElementById("sysop-presence");
      if (presence) {
        presence.className = "presence " + (on ? "online" : "offline");
        presence.title = on ? "SysOp is on the board" : "SysOp is away from the board";
        var label = presence.querySelector(".presence-label");
        if (label) label.textContent = on ? "ONLINE" : "OFFLINE";
      }
      function paintClock() {
        var clock = document.getElementById("status-clock");
        var right = document.getElementById("status-right");
        if (right) right.innerHTML = '<span class="status-clock" id="status-clock">' + boardClock() + '</span>';
        else if (clock) clock.textContent = boardClock();
        var left = document.getElementById("footer-left");
        try {
          var start = sessionStorage.getItem("fb_session_start");
          if (start && left) {
            var onMin = Math.max(0, Math.floor((Date.now() - Number(start)) / 60000));
            var remain = Math.max(0, 60 - onMin);
            var handle = "GUEST";
            try { handle = localStorage.getItem("fb_handle") || "GUEST"; } catch (e2) {}
            var lvl = sessionStorage.getItem("fb_session_level") || "";
            left.innerHTML = '<span class="session-handle">' + handle + '</span>  ' +
              (lvl ? ('LVL ' + lvl + '  ') : '') +
              '<span class="status-timeleft">TIME LEFT: ' + remain + '</span>';
          }
        } catch (e) {}
      }
      paintClock();
      setInterval(paintClock, 15000);
    })();
  </script>
</body>
</html>
