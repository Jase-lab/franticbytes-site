<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#03140a">
  <title>File not found — FranticBytes BBS</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.franticbytes.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="crt">
    <div class="bezel">
      <div class="screen-wrap">
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <header class="status-bar">
          <span>FRANTICBBS  //  NODE 1  //  2400 8-N-1</span>
          <span>ERROR 404</span>
        </header>
        <main class="screen">
          <section class="panel">
            <h1 id="title">*** FILE NOT FOUND ***</h1>
            <p class="rule" aria-hidden="true">========================================</p>
            <p id="body">That path is not on this board.</p>
            <p class="dim" id="path"></p>
            <nav class="menu">
              <a class="menu-item" href="/"><kbd>B</kbd> Back to FranticBytes</a>
              <a class="menu-item" href="/#/write65/downloads"><kbd>D</kbd> Write65 downloads</a>
            </nav>
          </section>
        </main>
        <footer class="status-bar footer-bar">
          <span id="footer-left">www.franticbytes.com</span>
          <span id="footer-right" class="sysop-corner">
            <span class="sysop-name">SYSOP: Lord Frazzle</span>
            <span class="presence" id="sysop-presence"><span class="dot" aria-hidden="true"></span><span class="presence-label"></span></span>
            <span class="sysop-date" id="sysop-date"></span>
          </span>
        </footer>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var path = location.pathname || "/";
      document.getElementById("path").textContent = "Requested: " + path;
      if (/\/downloads\//i.test(path)) {
        document.title = "Coming soon — FranticBytes BBS";
        document.getElementById("title").textContent = "*** COMING SOON ***";
        document.getElementById("body").textContent =
          "That build has not been uploaded to the board yet. Check back after the next drop.";
      }

      function todayStamp() {
        try {
          var parts = new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Denver",
            day: "2-digit",
            month: "short",
            year: "2-digit"
          }).formatToParts(new Date());
          var get = function (t) {
            for (var i = 0; i < parts.length; i++) if (parts[i].type === t) return parts[i].value;
            return "";
          };
          return get("day") + " " + get("month").replace(".", "").toUpperCase() + " " + get("year");
        } catch (e) {
          return "";
        }
      }

      function sysopIsOnline() {
        try {
          var key = "fb_sysop_online";
          var existing = sessionStorage.getItem(key);
          if (existing === "1" || existing === "0") return existing === "1";
          var on = Math.random() < 0.5;
          sessionStorage.setItem(key, on ? "1" : "0");
          return on;
        } catch (e) {
          return Math.random() < 0.5;
        }
      }

      var on = sysopIsOnline();
      var presence = document.getElementById("sysop-presence");
      var dateEl = document.getElementById("sysop-date");
      if (presence) {
        presence.className = "presence " + (on ? "online" : "offline");
        presence.title = on ? "SysOp is on the board" : "SysOp is away from the board";
        var label = presence.querySelector(".presence-label");
        if (label) label.textContent = on ? "ONLINE" : "OFFLINE";
      }
      if (dateEl) dateEl.textContent = todayStamp();
    })();
  </script>
</body>
</html>
